name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: TZ=UTC cargo nextest run --workspace --all-features

  # Supply-chain gates from AGENTS.md. Each step runs even if an earlier one fails so one run reports all three.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Install cargo-deny, cargo-audit, cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-machete

      - name: Deny
        run: cargo deny check

      - name: Audit
        if: success() || failure()
        run: cargo audit

      - name: Machete
        if: success() || failure()
        run: cargo machete --with-metadata

  # Release version surfaces (AGENTS.md "Deploy and release") must agree on every change.
  version-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version sync
        run: scripts/check-version-sync.sh

  # Compiles and lints the macOS-only discovery path (#[cfg(target_os = "macos")] in discover.rs).
  # Ubuntu is the full gate host (including supply-chain checks); macOS runs fmt/clippy/test only.
  check-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: TZ=UTC cargo test --workspace
