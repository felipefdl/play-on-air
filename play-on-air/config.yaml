name: PlayOnAir
version: "0.1.3"
slug: play_on_air
description: >
  Chromecast devices as AirPlay 2 speakers on the local network.
  Discovers Google Cast devices and bridges AirPlay 2 audio over host networking.
url: https://github.com/felipefdl/play-on-air
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
stage: stable
image: "ghcr.io/felipefdl/play-on-air"
options: {}
schema: false
map:
  - type: addon_config
    read_only: false
environment:
  PLAY_ON_AIR_CONFIG: /config/play-on-air.toml
