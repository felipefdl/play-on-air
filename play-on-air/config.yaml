name: PlayOnAir
version: "0.5.3"
slug: play_on_air
description: >
  AirPlay 2 for your Google Cast speakers: Nest speakers, Chromecasts, and Cast TVs
  in the AirPlay picker, in sync across rooms, with Apple Home and Siri.
url: https://github.com/felipefdl/play-on-air
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
stage: stable
image: "ghcr.io/felipefdl/play-on-air"
options:
  log_level: info
  # Optional only — empty means every discovered Chromecast is advertised as-is.
  device_overrides: []
schema:
  log_level: list(trace|debug|info|warn|error)
  device_overrides:
    - id: str
      name: "str?"
      hide: "bool?"
map:
  - type: addon_config
    read_only: false
environment:
  PLAY_ON_AIR_CONFIG: /config/play-on-air.toml
  PLAY_ON_AIR_STATE_DIR: /data
