[workspace]
resolver = "3"
members = ["crates/*"]
# Path dep only (hard-stop fork). Not a member: do not run vendor tests or apply
# workspace package membership — see vendor/shairplay/PLAYONAIR.md.
exclude = ["vendor/shairplay"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.2.3"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = [] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
claxon = "0.4"
flacenc = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hound = "3.5"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
log = "0.4"
mdns-sd = "0.20"
parking_lot = "0.12"
rust_cast = "0.21"
# Direct dep for custom Cast TLS connect (SO_RCVTIMEO on the real client socket).
# Already in the graph via rust_cast 0.21; pin matches that path.
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vendored fork (LGPL-3.0-or-later): hard-stop aborts live RTSP/AP2 session tasks.
# See vendor/shairplay/PLAYONAIR.md. Version pins lockfile/deny (path alone is `*`).
shairplay = { path = "vendor/shairplay", version = "0.7.0", features = ["ap2"] }
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "sync",
  "io-util",
  "time",
  "fs",
] }
toml = { version = "0.8", features = ["parse", "display"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
single_use_lifetimes = "deny"
unreachable_pub = "deny"
dead_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Group baselines (priority -1 so finer rules can override).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }

# Restriction / safety lints we do want (max bar; not the full restriction group).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
invalid_upcast_comparisons = "deny"
indexing_slicing = "deny"
string_slice = "deny"
string_add = "deny"
get_unwrap = "deny"
wildcard_enum_match_arm = "deny"
empty_structs_with_brackets = "deny"
try_err = "deny"
clone_on_ref_ptr = "deny"
filetype_is_file = "deny"
inline_asm_x86_att_syntax = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
allow_attributes_without_reason = "deny"
# Prefer `foo/mod.rs` when `foo/` has submodules (classic layout).
mod_module_files = "allow"
self_named_module_files = "allow"
pub_without_shorthand = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
unneeded_field_pattern = "deny"
unseparated_literal_suffix = "deny"
verbose_file_reads = "deny"
decimal_literal_representation = "allow"

# Audio project overrides (sample format / frame math).
float_arithmetic = "allow"
as_conversions = "allow"
cast_sign_loss = "allow"
integer_division = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"

# Pedantic / nursery noise that fights this codebase style without safety gain.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
double_must_use = "allow"
# MSRV 1.88 nursery scores this far above the clippy.toml threshold on ordinary
# control-flow (Cast workers, discovery). Current clippy (1.9x) does not gate CI
# the same way. Prefer design review over this unstable metric.
cognitive_complexity = "allow"
# Conflicts with unreachable_pub on items in private modules; prefer explicit pub(crate).
redundant_pub_crate = "allow"
# Binary crates often look "redundant" to cargo lints; lockfile is the source of truth.
multiple_crate_versions = "allow"
wildcard_dependencies = "allow"
cargo_common_metadata = "allow"

[profile.dev]
debug = true
overflow-checks = true

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true
debug = false
