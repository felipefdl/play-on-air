# cargo-deny: advisories, licenses, bans, sources. Fail the gate on real risk.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# cargo-deny 0.20+: vulnerabilities always error; configure unmaintained/yanked/unsound.
# Docs: https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
ignore = [
  # rsa via shairplay (AirPlay pairing). No safe upgrade on crates.io yet.
  # Acceptable for LAN-only personal use; revisit when shairplay moves off rsa 0.9.
  { id = "RUSTSEC-2023-0071", reason = "transitive via shairplay; no patched rsa; LAN AP2 path only" },
]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
unused-ignored-advisory = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "OpenSSL",
  "CC0-1.0",
  "MIT-0",
  "0BSD",
  "BSL-1.0",
  "MPL-2.0",
  # webpki-roots (rustls / reqwest trust store)
  "CDLA-Permissive-2.0",
  # shairplay (AirPlay 2 stack)
  "LGPL-3.0",
  "LGPL-3.0-or-later",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
