[package]
name = "play-on-air"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Chromecast devices as AirPlay 2 speakers on the local network"
readme = "../../VISION.md"

[[bin]]
name = "play-on-air"
path = "src/main.rs"

[lib]
name = "play_on_air"
path = "src/lib.rs"

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
flacenc = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
if-addrs = "0.13"
parking_lot = { workspace = true }
rust_cast = { workspace = true }
rustls = { workspace = true }
rustls-webpki = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shairplay = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
x509-parser = { workspace = true }

# Linux discovery uses in-process mDNS (no avahi-daemon / D-Bus required in containers).
[target.'cfg(target_os = "linux")'.dependencies]
mdns-sd = { workspace = true }

[dev-dependencies]
# tests/e2e_buffered: synthetic AirPlay 2 sender (SRP, ChaCha20-Poly1305, plist) and fake Cast JSON.
# All already in the graph via shairplay / rust_cast.
chacha20poly1305 = "0.10"
claxon = { workspace = true }
num-bigint = "0.4"
plist = "1.9"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
# Time control for prebuffer-timeout and similar bridge unit tests.
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
